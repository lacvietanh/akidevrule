name: npm-publish

# Publish @akinet/akidevrule to npm when a bare-semver tag (X.Y.Z, no "v" — release.A3) is pushed.
# Requires repo secret NPM_TOKEN (npm automation token, publish rights on @akinet) and a public repo (provenance needs id-token: write).

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync package.json version from CHANGELOG
        run: node scripts/sync-version.mjs

      - name: Verify tag matches CHANGELOG version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package/CHANGELOG=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match CHANGELOG version $PKG"
            exit 1
          fi

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
