name: install-smoke

on:
  push:
    branches: [master]
  pull_request:

jobs:
  record-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plans, index and CHANGELOG agree with the tree
        run: |
          python3 skills/akiflow/scripts/plan_lint.py .
          python3 skills/akiflow/scripts/release_lint.py --latest .
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exercise installer profiles
        shell: node {0}
        env:
          HOME: ${{ runner.temp }}/akihome
          USERPROFILE: ${{ runner.temp }}/akihome
          CLAUDE_CONFIG_DIR: ''
        run: |
          const fs = require("node:fs");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");
          const home = process.env.HOME;
          const primary = path.join(home, ".claude");
          const envProfile = path.join(home, "claude-env");
          const flagProfile = path.join(home, "claude-flag");
          const brokenProfile = path.join(home, "claude-broken");
          const gemini = path.join(home, ".gemini");
          const agCliSettings = path.join(gemini, "antigravity-cli", "settings.json");
          const skillsJson = path.join(gemini, "config", "skills.json");
          const write = (file, text) => { fs.mkdirSync(path.dirname(file), { recursive: true }); fs.writeFileSync(file, text); };
          const run = (args, env = {}) => {
            const result = spawnSync(process.execPath, ["install.mjs", ...args], { cwd: process.cwd(), env: { ...process.env, CLAUDE_CONFIG_DIR: "", ...env }, encoding: "utf8" });
            if (result.error || result.status !== 0) throw new Error(result.error || result.stdout + result.stderr);
          };
          fs.rmSync(home, { recursive: true, force: true });
          write(path.join(primary, "settings.json"), JSON.stringify({ unrelated: true }));
          write(path.join(primary, "skills", "other", "SKILL.md"), "other\n");
          write(path.join(primary, "agents", "other.md"), "other\n");
          write(path.join(envProfile, "settings.json"), JSON.stringify({ environmentProfile: true }));
          write(path.join(flagProfile, "settings.json"), JSON.stringify({ flagProfile: true }));
          write(path.join(gemini, "settings.json"), JSON.stringify({ unrelated: true }));
          run([]);
          run([]);
          run([], { CLAUDE_CONFIG_DIR: envProfile });
          run(["--claude-dir", flagProfile]);
          for (const file of [path.join(primary, "CLAUDE.md"), path.join(envProfile, "CLAUDE.md"), path.join(flagProfile, "CLAUDE.md"), path.join(home, ".aki", "akidevrule", "RULE-agent-behavior.md"), path.join(primary, "hooks", "aki-route-guard.mjs"), path.join(primary, "hooks", "aki-compact-reread.mjs")]) if (!fs.existsSync(file)) throw new Error(`missing ${file}`);
          const hooksCfg = JSON.parse(fs.readFileSync(path.join(primary, "settings.json"))).hooks;
          const attribution = JSON.parse(fs.readFileSync(path.join(primary, "settings.json"))).attribution;
          if (!attribution || attribution.commit !== "" || attribution.pr !== "" || attribution.sessionUrl !== false) throw new Error(`attribution not turned off: ${JSON.stringify(attribution)}`);
          if (!hooksCfg.SessionStart.some((e) => e.matcher === "compact" && e.hooks.some((h) => h.command.includes("aki-compact-reread")))) throw new Error("compact SessionStart hook not registered");
          const routeMap = JSON.parse(fs.readFileSync(path.join(home, ".aki", "akidevrule", "route-map.json"), "utf8"));
          if (!Array.isArray(routeMap.routes) || routeMap.routes.length === 0) throw new Error("route-map.json has no routes");
          const guardMatchers = (matcher) => (hooksCfg.PreToolUse || []).filter((e) => e.matcher === matcher && e.hooks.some((h) => h.command.includes("aki-route-guard.mjs")));
          for (const matcher of ["Read", "Edit|MultiEdit|Write|NotebookEdit"]) if (guardMatchers(matcher).length === 0) throw new Error(`aki-route-guard not registered for PreToolUse ${matcher}`);
          const guard = (event) => spawnSync(process.execPath, [path.join(primary, "hooks", "aki-route-guard.mjs")], { input: JSON.stringify({ hook_event_name: "PreToolUse", session_id: "x", ...event }), env: { ...process.env, CLAUDE_CONFIG_DIR: "" }, encoding: "utf8" }).stdout;
          const proj = path.join(path.parse(home).root, "akismoke-proj"); // never created; outside HOME so a HOME under an ungated scratchpad cannot mask the deny
          const transcript = path.join(home, "transcript.jsonl");
          write(transcript, "");
          const denied = guard({ tool_name: "Edit", transcript_path: transcript, cwd: proj, tool_input: { file_path: path.join(proj, "src", "a.js") } });
          if (!denied.includes("deny") || !denied.includes("RULE-coding.md") || !denied.includes("RULE-pattern-core.md")) throw new Error(`route gate did not deny an unread code edit: ${denied}`);
          const widened = guard({ tool_name: "Read", transcript_path: transcript, cwd: proj, tool_input: { file_path: path.join(home, ".aki", "akidevrule", "RULE-docs.md"), limit: 5 } });
          if (!widened.includes("updatedInput") || "limit" in JSON.parse(widened).hookSpecificOutput.updatedInput) throw new Error(`partial rule Read was not widened: ${widened}`);
          if (fs.existsSync(path.join(home, ".codex"))) throw new Error("~/.codex must not be created by an install");
          const codexHome = path.join(home, ".codex");
          write(path.join(codexHome, "AGENTS.md"), "# my own codex notes\nkeep me\n");
          write(path.join(codexHome, "config.toml"), "model = \"x\"\n\n[mcp_servers.demo]\ncommand = \"demo\"\n");
          run([]);
          run([]);
          const agentsMd = fs.readFileSync(path.join(codexHome, "AGENTS.md"), "utf8");
          if (!agentsMd.startsWith("# my own codex notes\nkeep me\n") || (agentsMd.match(/>>> akidevrule managed/g) || []).length !== 1 || !agentsMd.includes("## Routes") || !agentsMd.includes("### B7.")) throw new Error("Codex managed block missing, duplicated, or user text lost");
          const codexCfg = fs.readFileSync(path.join(codexHome, "config.toml"), "utf8");
          if (!/^project_doc_max_bytes = \d+/m.test(codexCfg) || codexCfg.indexOf("project_doc_max_bytes") > codexCfg.indexOf("[mcp_servers.demo]") || (codexCfg.match(/project_doc_max_bytes/g) || []).length !== 1 || !codexCfg.includes("model = \"x\"")) throw new Error("Codex project_doc_max_bytes not written once before the first table");
          if (!JSON.parse(fs.readFileSync(path.join(primary, "settings.json"))).unrelated || !fs.existsSync(path.join(primary, "skills", "other", "SKILL.md")) || !fs.existsSync(path.join(primary, "agents", "other.md"))) throw new Error("unrelated Claude content changed");
          const ag = JSON.parse(fs.readFileSync(path.join(gemini, "settings.json")));
          if (!ag.unrelated || ag.permissions.allowNonWorkspaceAccess !== true || ag.permissions.agentMode !== true || !ag.permissions.trustedWorkspaces.includes(home)) throw new Error("Antigravity permission fields did not persist");
          const agCli = JSON.parse(fs.readFileSync(agCliSettings));
          const allowBeforeFieldOnlyUpdate = JSON.stringify(agCli.permissions.allow);
          agCli.permissions.agentMode = false;
          write(agCliSettings, JSON.stringify(agCli));
          run([]);
          const agCliAfterFieldOnlyUpdate = JSON.parse(fs.readFileSync(agCliSettings));
          if (agCliAfterFieldOnlyUpdate.permissions.agentMode !== true || JSON.stringify(agCliAfterFieldOnlyUpdate.permissions.allow) !== allowBeforeFieldOnlyUpdate) throw new Error("Antigravity field-only update changed an allowlist or did not persist");
          const snapshot = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
            const file = path.join(dir, entry.name);
            return entry.isDirectory() ? snapshot(file) : [[path.relative(home, file), fs.readFileSync(file).toString("base64")]];
          }).sort((a, b) => a[0].localeCompare(b[0]));
          const assertPreflightFailure = (file, label) => {
            write(file, "not JSON");
            const beforeFailure = JSON.stringify(snapshot(home));
            const failed = spawnSync(process.execPath, ["install.mjs", "--claude-dir", brokenProfile], { cwd: process.cwd(), env: { ...process.env, CLAUDE_CONFIG_DIR: "" }, encoding: "utf8" });
            if (failed.error || failed.status === 0) throw new Error(`${label} did not fail`);
            if (JSON.stringify(snapshot(home)) !== beforeFailure) throw new Error(`${label} preflight mutated a target`);
            write(file, "{}\n");
            run([]);
          };
          write(path.join(primary, "preflight-sentinel"), "unchanged\n");
          assertPreflightFailure(skillsJson, "malformed Gemini skills.json");
          assertPreflightFailure(agCliSettings, "malformed Antigravity settings");
          assertPreflightFailure(path.join(brokenProfile, "settings.json"), "malformed Claude settings");
          // rtk: a fake binary on PATH prints `Config: <path>` like the real one; the config is written only on --rtk (no TTY here), never twice, never over the user's own list.
          const rtkBin = path.join(home, "rtkbin");
          const rtkCfg = path.join(home, "rtkcfg", "config.toml");
          if (process.platform === "win32") write(path.join(rtkBin, "rtk.cmd"), `@echo Config: ${rtkCfg}\r\n`);
          else { write(path.join(rtkBin, "rtk"), `#!/bin/sh\necho "Config: ${rtkCfg}"\n`); fs.chmodSync(path.join(rtkBin, "rtk"), 0o755); }
          const runOut = (args, env = {}) => { const r = spawnSync(process.execPath, ["install.mjs", ...args], { cwd: process.cwd(), env: { ...process.env, CLAUDE_CONFIG_DIR: "", ...env }, encoding: "utf8" }); if (r.error || r.status !== 0) throw new Error(r.error || r.stdout + r.stderr); return r.stdout; };
          const withRtk = { PATH: rtkBin + path.delimiter + process.env.PATH, Path: rtkBin + path.delimiter + (process.env.Path || process.env.PATH) };
          const rtkNames = process.platform === "win32" ? ["rtk.exe", "rtk.cmd"] : ["rtk"];
          const pathWithoutRtk = (process.env.PATH || process.env.Path || "").split(path.delimiter).filter((d) => !rtkNames.some((n) => fs.existsSync(path.join(d, n)))).join(path.delimiter);
          const withoutRtk = { PATH: pathWithoutRtk, Path: pathWithoutRtk };
          if (!runOut([], withoutRtk).includes("rtk not found")) throw new Error("rtk absent: hint line missing");
          if (!runOut([], withRtk).includes("rtk found, left as is") || fs.existsSync(rtkCfg)) throw new Error("rtk present without --rtk must be left untouched");
          if (!runOut(["--rtk"], withRtk).includes("accuracy-first config written") || !fs.readFileSync(rtkCfg, "utf8").includes("[hooks]")) throw new Error("--rtk did not write the config");
          const rtkFirst = fs.readFileSync(rtkCfg, "utf8");
          if (!runOut(["--rtk"], withRtk).includes("already in place") || fs.readFileSync(rtkCfg, "utf8") !== rtkFirst || fs.readdirSync(path.dirname(rtkCfg)).some((n) => n.includes("akidevrule-backup"))) throw new Error("--rtk re-run changed the config or left a backup");
          write(rtkCfg, "[hooks]\nexclude_commands = [\"ls\"]\n");
          if (!runOut(["--rtk"], withRtk).includes("kept as yours") || fs.readFileSync(rtkCfg, "utf8") !== "[hooks]\nexclude_commands = [\"ls\"]\n") throw new Error("--rtk overwrote the user's own exclude_commands");
          write(rtkCfg, "# akidevrule: rtk off\n");
          if (!runOut(["--rtk"], withRtk).includes("skipped") || fs.readFileSync(rtkCfg, "utf8") !== "# akidevrule: rtk off\n") throw new Error("rtk opt-out line not honored");
          write(rtkCfg, rtkFirst);
          if (!runOut([], withRtk).includes("already in place")) throw new Error("rtk managed config must be reported without --rtk");
          const rulesDir = path.join(gemini, "config", "rules");
          const agFrontmatter = (name) => Object.fromEntries(fs.readFileSync(path.join(rulesDir, name), "utf8").match(/^---\n([\s\S]*?)\n---\n/)[1].split("\n").map((l) => [l.slice(0, l.indexOf(":")), l.slice(l.indexOf(":") + 2)]));
          const expectedGlobs = {
            "akirule-stack-tauri.md": ["src-tauri/**", "**/*.rs", "tauri.conf.json"],
            "akirule-stack-akinuxtcf.md": ["**/*.vue", "nuxt.config.*", "wrangler.toml", "app/**", "server/**", "composables/**", "middleware/**", "plugins/**", "layouts/**"],
          };
          for (const [name, patterns] of Object.entries(expectedGlobs)) {
            const raw = agFrontmatter(name).globs;
            if (typeof JSON.parse(raw) !== "string" || JSON.stringify(JSON.parse(raw).split(", ")) !== JSON.stringify(patterns)) throw new Error(`${name} globs must be one quoted string carrying exactly ${patterns.length} patterns: ${raw}`);
          }
          const routeRows = [...fs.readFileSync(path.join("skills", "akirule", "SKILL.md"), "utf8").matchAll(/^\| `((?:RULE|METHOD)-[^`]+\.md)` · `[\w-]+` \| ([^|]+) \| ([^|]+) \|/gm)];
          const generatedRules = fs.readdirSync(rulesDir).filter((n) => n.startsWith("akirule-"));
          if (routeRows.length === 0 || routeRows.length !== generatedRules.length - 1) throw new Error(`router rows (${routeRows.length}) must cover every generated rule but agent-behavior (${generatedRules.length})`);
          for (const [, file, clause, signals] of routeRows) {
            const desc = JSON.parse(agFrontmatter(`akirule-${file.replace(/^(RULE|METHOD)-/, "").replace(/\.md$/, "").toLowerCase()}.md`).description);
            for (const part of [clause.trim(), signals.trim(), `view_file ~/.aki/akidevrule/${file}`]) if (!desc.includes(part)) throw new Error(`${file} description lost: ${part.slice(0, 60)}`);
          }
          const thinkDesc = JSON.parse(agFrontmatter("akirule-deep-think.md").description);
          if (!thinkDesc.includes("should we") || !thinkDesc.includes("có nên")) throw new Error(`deep-think description lacks the English and Vietnamese signals: ${thinkDesc}`);
          const summary = runOut([]);
          if (summary.includes("[object Object]") || !/loads when the task \S/.test(summary)) throw new Error("installer summary must print route clauses, never [object Object]");
          write(skillsJson, JSON.stringify({ keep: true, entries: [
            { path: "~/.aki/akidevrule/agskills", note: "mine" },
            { path: path.join(home, ".aki", "akidevrule", "agskills"), duplicate: true },
            { path: "/opt/foreign/skills", label: "foreign", enabled: false },
            { path: "~/.aki/claudedoc/agskills" },
          ] }));
          run([]);
          const skillsAfterFirst = fs.readFileSync(skillsJson, "utf8");
          const skillEntries = JSON.parse(skillsAfterFirst).entries;
          const ownAgskills = path.join(home, ".aki", "akidevrule", "agskills");
          if (skillEntries.some((e) => e.path.startsWith("~")) || new Set(skillEntries.map((e) => e.path)).size !== skillEntries.length) throw new Error(`skills.json kept a tilde path or a duplicate: ${skillsAfterFirst}`);
          if (JSON.stringify(skillEntries[0]) !== JSON.stringify({ path: ownAgskills, note: "mine" }) || JSON.stringify(skillEntries[1]) !== JSON.stringify({ path: "/opt/foreign/skills", label: "foreign", enabled: false }) || skillEntries[2].path !== path.join(home, ".aki", "claudedoc", "agskills") || skillEntries.length !== 3 || JSON.parse(skillsAfterFirst).keep !== true) throw new Error(`skills.json lost or reordered a foreign entry, a field, or the legacy root: ${skillsAfterFirst}`);
          run([]);
          if (fs.readFileSync(skillsJson, "utf8") !== skillsAfterFirst) throw new Error("second install changed skills.json");
          console.log(`OK: installer smoke passed on ${process.platform}`);
