name: install-smoke

# No maintainer runs Windows locally — this matrix is what makes the Windows-support claim true.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run installer into sandbox HOME
        env:
          HOME: ${{ runner.temp }}/akihome
          USERPROFILE: ${{ runner.temp }}/akihome
        run: node install.mjs

      - name: Assert install manifest
        shell: node {0}
        env:
          HOME: ${{ runner.temp }}/akihome
          USERPROFILE: ${{ runner.temp }}/akihome
        run: |
          const { existsSync, readFileSync, readdirSync, statSync } = require("node:fs");
          const { join } = require("node:path");
          const { homedir } = require("node:os");
          const home = homedir();
          const mustExist = [
            join(home, ".aki", "akidevrule", "index.md"),
            join(home, ".aki", "akidevrule", "RULE-agent-behavior.md"),
            join(home, ".aki", "akidevrule", "RULE-coding.md"),
            join(home, ".aki", "akidevrule", ".source-repo"),
            join(home, ".claude", "CLAUDE.md"),
            join(home, ".claude", "skills", "akiflow", "SKILL.md"),
            join(home, ".claude", "agents", "aki-conduct.md"),
            join(home, ".claude", "hooks", "aki-update-check.mjs"),
            join(home, ".claude", "hooks", "aki_version_check.mjs"),
          ];
          const missing = mustExist.filter((p) => !existsSync(p));
          if (missing.length) {
            console.log("MISSING after install on " + process.platform + ":\n  " + missing.join("\n  "));
            process.exit(1);
          }
          // LF discipline: no installed text file may carry CRLF.
          const crlf = [];
          const walk = (dir) => {
            for (const n of readdirSync(dir)) {
              const p = join(dir, n);
              if (statSync(p).isDirectory()) walk(p);
              else if (n.endsWith(".md") && readFileSync(p).includes("\r\n")) crlf.push(p);
            }
          };
          for (const root of [join(home, ".aki", "akidevrule"), join(home, ".claude", "skills")]) walk(root);
          if (crlf.length) {
            console.log("CRLF found in installed files on " + process.platform + ":\n  " + crlf.slice(0, 20).join("\n  "));
            process.exit(1);
          }
          console.log("OK: manifest present and LF-clean on " + process.platform);
